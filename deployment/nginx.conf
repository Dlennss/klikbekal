# klikbekal.com: run its production Next.js server on 172.22.0.1:33014.
server {
    listen 80;
    listen [::]:80;
    set $server 172.22.0.1;
    server_name klikbekal.com www.klikbekal.com;
    access_log /data/logs/fadlan-klikbekal.com-access.log proxy;
    error_log /data/logs/fadlan-klikbekal.com-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
    }
    location / {
        proxy_pass http://172.22.0.1:33014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fadlan_connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 504 =503 @app_unavailable;
    }
    location @app_unavailable {
        default_type text/html;
        add_header Retry-After 300 always;
        return 503 '<!doctype html><html lang="id"><meta charset="utf-8"><title>klikbekal.com</title><h1>klikbekal.com</h1><p>Aplikasi sedang disiapkan. Silakan kembali nanti.</p></html>';
    }
}
